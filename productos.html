<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

        <nav class="navegacion"><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="nosotros.html">Nosotros</a><a href="contacto.html">Contacto</a></nav>
    </div>

<main>

</main>
<footer class="footer"><div class="contenedor"><p>© 2026 SU ESTILO MUEBLERÍA</p></div></footer>
